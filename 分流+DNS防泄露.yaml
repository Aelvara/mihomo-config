  - "DOMAIN-SUFFIX,long.xyz,💰 币圈专用 [自选]"
  - "DOMAIN-SUFFIX,aicoin.com,💰 币圈专用 [自选]"
  - "DOMAIN-SUFFIX,aicoinstorge.com,💰 币圈专用 [自选]"

  # 视频：境外视频站（31 个 GEOSITE，含 tiktok）→ 🎬 流媒体 [自选]；默认走 ⚡ 流媒体测速（按带宽挑，不按 DoH 延迟）
  - "GEOSITE,netflix,🎬 流媒体 [自选]"   # Netflix
  - "GEOSITE,disney,🎬 流媒体 [自选]"   # Disney+ / Hulu 系（同分类）
  - "GEOSITE,hbo,🎬 流媒体 [自选]"   # HBO Max
  - "GEOSITE,hulu,🎬 流媒体 [自选]"   # Hulu
  - "GEOSITE,primevideo,🎬 流媒体 [自选]"   # Prime Video
