  - "DOMAIN-SUFFIX,st.dl.pinyuncloud.com,DIRECT"
  - "DOMAIN-SUFFIX,alibaba.cdn.steampipe.steamcontent.com,DIRECT"

  # 软件进程优先（原 software provider，已内联；PROCESS-NAME-WILDCARD 依赖 find-process-mode: always）
  - "PROCESS-NAME-WILDCARD,*Discord*,🖥️ 软件分流 [自选]"
  - "PROCESS-NAME-WILDCARD,*Steam*,🖥️ 软件分流 [自选]"
  - "PROCESS-NAME-WILDCARD,*EpicGames*,🖥️ 软件分流 [自选]"
  - "PROCESS-NAME-WILDCARD,*WhatsApp*,🖥️ 软件分流 [自选]"

  # 私有地址 / 局域网
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"

  # 广告（原 ads provider → 单行 GEOSITE，已内联）
